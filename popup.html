<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Account Switcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface-hover: #2e2e3a;
      --surface-active: #1e1e28;
      --border: #2a2a35;
      --accent: #4e8cff;
      --accent-dim: rgba(78, 140, 255, 0.15);
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-mono: #a0b4cc;
      --radius: 10px;
      --radius-sm: 6px;

      /* Google brand colors */
      --g-blue: #4285F4;
      --g-red: #EA4335;
      --g-yellow: #FBBC05;
      --g-green: #34A853;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      min-height: 120px;
      max-height: 560px;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-dot {
      width: 16px;
      height: 16px;
      background:
        linear-gradient(to right, var(--g-blue) 50%, var(--g-red) 50%) top / 100% 50% no-repeat,
        linear-gradient(to right, var(--g-yellow) 50%, var(--g-green) 50%) bottom / 100% 50% no-repeat;
      border-radius: 50%;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .header-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .btn-refresh {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .btn-refresh:hover {
      background: var(--surface);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    .btn-refresh:active {
      background: var(--accent-dim);
    }

    .btn-refresh svg {
      width: 14px;
      height: 14px;
    }

    .btn-refresh.spinning svg {
      animation: spin 0.7s linear infinite;
    }

    /* ── Account list ───────────────────────────────── */
    .account-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 460px;
    }

    .account-list::-webkit-scrollbar {
      width: 4px;
    }

    .account-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .account-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* ── Account card ───────────────────────────────── */
    .account-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }

    .account-card.is-active {
      background: var(--surface-active);
    }

    .account-card.is-active.color-0 { border-color: #4285F4; }
    .account-card.is-active.color-1 { border-color: #9c27b0; }
    .account-card.is-active.color-2 { border-color: #34A853; }
    .account-card.is-active.color-3 { border-color: #FBBC05; }
    .account-card.is-active.color-4 { border-color: #EA4335; }

    .account-card:hover {
      background: var(--surface-hover);
    }

    /* ── Avatar ─────────────────────────────────────── */
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }

    .color-0 { background: #4285F4; }
    .color-1 { background: #9c27b0; }
    .color-2 { background: #34A853; }
    .color-3 { background: #FBBC05; color: #222; }
    .color-4 { background: #EA4335; }

    /* ── Account info ───────────────────────────────── */
    .account-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .account-name-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .account-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-active {
      position: absolute;
      top: 8px;
      right: 10px;
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-active.color-0 { background: #4285F4; border-color: #4285F4; color: #ffffff; }
    .badge-active.color-1 { background: #9c27b0; border-color: #9c27b0; color: #ffffff; }
    .badge-active.color-2 { background: #34A853; border-color: #34A853; color: #ffffff; }
    .badge-active.color-3 { background: #FBBC05; border-color: #FBBC05; color: #1a1a1a; }
    .badge-active.color-4 { background: #EA4335; border-color: #EA4335; color: #ffffff; }

    .account-email {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Loading state ──────────────────────────────── */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px 20px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .loader {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    /* ── Empty state ────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .empty-icon svg {
      width: 20px;
      height: 20px;
    }

    .empty-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 240px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-dot"></div>
    <span class="header-title">Google Account Switcher</span>
    <button class="btn-refresh" id="btnRefresh" title="Refresh accounts" aria-label="Refresh accounts">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 8A5.5 5.5 0 1 1 10 3.07"/>
        <polyline points="10 1 10 4 13 4"/>
      </svg>
    </button>
  </header>

  <div class="account-list" id="accountList">
    <div class="loading-state">
      <div class="loader"></div>
      <span>Detecting accounts…</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
